[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_journal"
version = "0.2.0"
description = "A local, TradeZella-lite forex trading journal with read-only TradeLocker sync."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "trading_journal" }]
keywords = ["forex", "trading", "journal", "dashboard", "streamlit", "tradelocker"]

dependencies = [
    "SQLAlchemy>=2.0",
    "pandas>=2.0",
    "streamlit>=1.49",
    "plotly>=5.18",
    "pydantic>=2.5",
    "python-dateutil>=2.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
trading-journal = "trading_journal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_journal = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
    "B008",  # allow function calls in argument defaults (Streamlit/CLI patterns)
]

[tool.ruff.lint.isort]
known-first-party = ["trading_journal"]
